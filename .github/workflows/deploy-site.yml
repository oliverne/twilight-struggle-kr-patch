name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 리포 루트에는 package.json이 없다 — 사이트는 website/ 하위 패키지다.
          # 미지정 시 action이 루트 package.json을 읽어 실패한다
          # ("No pnpm version is specified").
          package_json_file: website/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Setup Pages
        # private 리포(Free 플랜)에서는 Pages API가 404를 반환한다 — 공개 전환 후에만 필요
        if: ${{ !github.event.repository.private }}
        uses: actions/configure-pages@v5
      - name: Install and Build
        uses: withastro/action@v3
        with:
          path: website
      - name: Upload artifact
        # Pages가 없으면 배포 산출물도 올릴 필요가 없다 (private에서는 빌드 검증만)
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    # ⚠️ GitHub Pages는 private 리포 + Free 플랜에서 사용할 수 없다 (2026-08-21 확인).
    #    - 저장소를 public으로 전환하면 이 조건이 자동으로 참이 되어 배포된다.
    #    - private을 유지하려면 다른 호스팅(Cloudflare Pages 등)으로 옮겨야 한다.
    #    - Pro/Team으로 업그레이드해 private 리포에 Pages를 쓰는 경우 이 조건을 제거한다.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
